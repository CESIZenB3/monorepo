version: '3.8'

services:
  cesizen-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cesizen-app
    ports:
      - "5000:80"    # Accès HTTP via localhost:5000
      - "5001:443"   # (Facultatif) HTTPS
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver-db;Database=CESIZenDb;User Id=sa;Password=MonMotDePasse123!
    volumes:
      - ./logs:/app/logs
    depends_on:
      - sqlserver-db
    networks:
      - app-network
    restart: unless-stopped

  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MonMotDePasse123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - app-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  app-network:
    driver: bridge
