name: 02-2 - Delivery - Trivy Scan - C# Back

on:
  workflow_call

env:
  REGISTRY: ghcr.io
  USERNAME: ${{ github.actor }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  Trivy_Scan_Back:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Registry Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.MONOREPO_PAT }}

      - name: Downcase Image Name
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Try to Pull Docker Image
        id: docker_pull
        run: |
          echo "Trying to pull image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-back:canary"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-back:canary || echo "Image not found"

      - name: Fallback Build if Pull Fails
        if: steps.docker_pull.conclusion == 'failure'
        run: |
          echo "Building image locally as fallback..."
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-back:canary .

      - name: Trivy BACK vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        env:
            TRIVY_DEBUG: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}-back:canary
          format: 'table'
          exit-code: '1'
          output: 'back-trivy-results.txt'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy results BACK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: back-trivy-results
          path: back-trivy-results.txt
          retention-days: 1
