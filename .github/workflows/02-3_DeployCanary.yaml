name: 02-3 - Deploy - Canary

on:
  push:
    branches:
      - main
  workflow_call:


jobs:
  AzureCanaryServer:
    runs-on: ubuntu-latest
    environment: CANARY

    env:
      ResourceGroupName: "monorepo-canary"
      ResourceGroupLocation: "francecentral"

    steps:
      # 1. Récupération du code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Connexion à Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Création du groupe de ressources
      - name: Azure CLI Create Resource Group
        run: |
          az group create --name ${{ env.ResourceGroupName }} --location ${{ env.ResourceGroupLocation }}
          echo "Azure resource group created"

      # 4. Nettoyage des IPs publiques inutilisées
      - name: Cleanup unused Public IPs
        run: |
          az network public-ip list --query "[?ipConfiguration==null].[name,resourceGroup]" -o table
          az network public-ip list --query "[?ipConfiguration==null]" --output tsv | while read name rg; do
            echo "Deleting unused public IP: $name in resource group: $rg"
            az network public-ip delete --name "$name" --resource-group "$rg" --no-wait || true
          done

      # 5. Suppression des anciens groupes "canary"
      - name: Cleanup old canary deployments
        run: |
          az group list --query "[?starts_with(name, 'monorepo-canary')].[name]" -o tsv | while read rg_name; do
            if [ "$rg_name" != "${{ env.ResourceGroupName }}" ]; then
              az group delete --name "$rg_name" --yes --no-wait || true
            fi
          done

      # 6. Déploiement ARM
      - name: Déployer ARM template via Azure CLI
        run: |
          az deployment group create \
            --name canaryDeployment-${{ github.run_number }} \
            --resource-group ${{ env.ResourceGroupName }} \
            --template-uri "https://raw.githubusercontent.com/Azure/azure-quickstart-templates/master/quickstarts/microsoft.compute/vm-simple-linux/azureDeploy.json" \
            --parameters adminUsername=${{ secrets.AZURE_VM_LOGIN }} adminPasswordOrKey=${{ secrets.AZURE_VM_PASSWORD }} vmName="Canary-Server" vmSize="Standard_B2s"

      # 7. Ouvrir les ports nécessaires
      - name: Open Port on Security Group
        run: |
          az network nsg rule create --resource-group ${{ env.ResourceGroupName }} --nsg-name SecGroupNet --name OuvrirPort5000 --priority 100 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes "*" --destination-port-ranges 5000
          az network nsg rule create --resource-group ${{ env.ResourceGroupName }} --nsg-name SecGroupNet --name OuvrirPort5001 --priority 101 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes "*" --destination-port-ranges 5001
      
      # 8. Récupérer l'IP publique
      - name: Get Public IP et créer règle 
        run: |
          echo "AZURE_VM_IP=$(az vm show -d -g ${{ env.ResourceGroupName }} -n Canary-Server --query publicIps -o tsv)" >> $GITHUB_ENV

      # 9. Installer Docker sur la VM
      - name: Install Docker on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.AZURE_VM_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.AZURE_VM_LOGIN }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
            sudo usermod -aG docker $USER

      # 10. Configurer DNS
      - name: Set DNS Domain in CesiZen
        run: |
          az network dns record-set a add-record -g CesiZenB3 -z demo-cesizenb3.com -n mono -a ${{ env.AZURE_VM_IP }}

      # 11. Debug - Vérifier la structure du projet
      - name: Debug - Structure du projet
        run: |
          echo "=== Recherche des fichiers C# ==="
          find . -name "*.sln" -o -name "*.csproj"
          echo "=== Structure des répertoires ==="
          ls -la
          echo "=== Contenu détaillé ==="
          find . -type f \( -name "*.sln" -o -name "*.csproj" -o -name "Dockerfile" -o -name "docker-compose.yaml" \)

      # 12. Copier TOUT le projet
      - name: Copier le projet complet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.AZURE_VM_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.AZURE_VM_LOGIN }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "."
          target: "/home/${{ secrets.AZURE_VM_LOGIN }}/project/"
          strip_components: 0

      # 13. Downcase nom d'image
      - name: Downcase Image Name
        run: echo "IMAGE_NAME_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # 14. Version courte du SHA (ERREUR CORRIGÉE)
      - name: Short SHA version
        run: echo "VERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      # 15. Vérifier, construire et démarrer
      - name: Vérifier et démarrer Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.AZURE_VM_IP }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.AZURE_VM_LOGIN }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Naviguer vers le répertoire du projet
            cd ~/project
            
            echo "=== Vérification des fichiers copiés ==="
            ls -la
            
            echo "=== Recherche des fichiers requis ==="
            find . -name "*.sln" -o -name "*.csproj" | head -10
            
            # Vérifier si les fichiers existent
            if [ ! -f "CESIZen.sln" ]; then
              echo "ERREUR: CESIZen.sln non trouvé dans $(pwd)"
              echo "Fichiers .sln disponibles :"
              find . -name "*.sln"
              echo "Contenu du répertoire :"
              ls -la
              exit 1
            fi
            
            if [ ! -d "CESIZen" ] || [ ! -f "CESIZen/CESIZen.csproj" ]; then
              echo "ERREUR: CESIZen/CESIZen.csproj non trouvé"
              echo "Fichiers .csproj disponibles :"
              find . -name "*.csproj"
              echo "Répertoires disponibles :"
              find . -type d -name "*CESIZen*"
              exit 1
            fi
            
            echo "=== Tous les fichiers requis sont présents ==="
            
            # Nettoyer les anciens containers
            docker compose down || true
            docker system prune -f || true
            
            # Build et démarrage
            echo "=== Construction des images Docker ==="
            docker compose build --no-cache
            
            echo "=== Démarrage des services ==="
            docker compose up -d
            
            # Vérification du statut
            sleep 15
            echo "=== Status des containers ==="
            docker compose ps
            
            echo "=== Logs des services ==="
            docker compose logs --tail=30