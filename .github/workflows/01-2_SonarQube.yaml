name: 01-2 - Integration - SONARQUBE

on:
  workflow_call:

jobs:
  QualityBack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CESIZen  # dossier de ton projet backend ASP.NET

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # adapte selon la version .NET utilisée

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test ../CESIZen.Tests --collect:"XPlat Code Coverage" --results-directory ./TestResults --no-build --configuration Release

      - name: Find coverage file
        id: find_coverage
        run: |
          COVERAGE_FILE=$(find ./TestResults -name '*.coverage' -or -name '*.coverage.json' | head -n 1)
          echo "coverage_file=$COVERAGE_FILE"
          echo "coverage_file=$COVERAGE_FILE" >> $GITHUB_OUTPUT

      - name: Generate coverage reports (lcov and cobertura)
        run: |
          echo "Using coverage file: ${{ steps.find_coverage.outputs.coverage_file }}"
          ./reportgeneratortool/reportgenerator -reports:${{ steps.find_coverage.outputs.coverage_file }} -targetdir:coverage-report -reporttypes:lcov,cobertura

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-coverage-report
          path: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: ./CESIZen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.cs.opencover.reportsPaths=coverage-report/cobertura.xml

      - name: Install ReportGenerator tool
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./reportgeneratortool --version 5.1.26
