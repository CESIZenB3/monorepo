name: 01-2 - Integration - SONARQUBE

on:
  workflow_call:

jobs:
  QualityBack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CESIZen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage (cobertura)
        run: dotnet test ../CESIZen.Tests --collect:"XPlat Code Coverage" --results-directory ./TestResults --configuration Release

      - name: Find cobertura coverage file
        id: find_coverage
        run: |
          echo "Looking for coverage.cobertura.xml..."
          COVERAGE_FILE=$(find ../CESIZen.Tests/TestResults -name 'coverage.cobertura.xml' | head -n 1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "❌ coverage.cobertura.xml not found!"
            exit 1
          fi
          echo "✅ Found: $COVERAGE_FILE"
          echo "coverage_file=$COVERAGE_FILE" >> $GITHUB_OUTPUT

      - name: Install ReportGenerator tool
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./reportgeneratortool --version 5.1.26

      - name: Generate coverage reports
        run: |
          echo "Using coverage file: ${{ steps.find_coverage.outputs.coverage_file }}"
          ./reportgeneratortool/reportgenerator \
            -reports:"${{ steps.find_coverage.outputs.coverage_file }}" \
            -targetdir:coverage-report \
            -reporttypes:lcov;cobertura

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-coverage-report
          path: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: ./CESIZen
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.cs.opencover.reportsPaths=coverage-report/cobertura.xml
